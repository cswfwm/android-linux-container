name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf make automake autoconf libtool pkg-config

      - name: Build static proot (armv7)
        run: |
          git clone --depth=1 https://github.com/proot-me/proot.git /tmp/proot
          cd /tmp/proot
          make -C src STATIC=1 \
            CC=arm-linux-gnueabihf-gcc \
            AR=arm-linux-gnueabihf-ar \
            RANLIB=arm-linux-gnueabihf-ranlib
          ls -la src/proot
          cp src/proot $GITHUB_WORKSPACE/proot

      - name: Fetch Alpine armhf minirootfs and pack as tar
        run: |
          curl -L -o /tmp/rootfs.tar.gz \
            "https://mirrors.huaweicloud.com/alpine/v3.12/releases/armhf/alpine-minirootfs-3.12.10-armhf.tar.gz"
          mkdir -p /tmp/rootfs
          tar -xzf /tmp/rootfs.tar.gz -C /tmp/rootfs
          # 写死镜像源为可切换的国内镜像
          mkdir -p /tmp/rootfs/etc
          printf '%s\n' \
            "https://mirrors.huaweicloud.com/alpine/v3.12/main" \
            "https://mirrors.huaweicloud.com/alpine/v3.12/community" > /tmp/rootfs/etc/apk/repositories
          tar -C /tmp/rootfs -cf rootfs.tar .
          ls -la rootfs.tar
          mv rootfs.tar $GITHUB_WORKSPACE/app/src/main/assets/rootfs.tar
          mv $GITHUB_WORKSPACE/proot $GITHUB_WORKSPACE/app/src/main/assets/proot

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: 34.0.0
          ndk-version: 25.1.8909393

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/25.1.8909393" >> local.properties
          cat local.properties

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload assets (proot + rootfs) for debugging
        uses: actions/upload-artifact@v4
        with:
          name: container-assets
          path: |
            app/src/main/assets/proot
            app/src/main/assets/rootfs.tar
          retention-days: 7