name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # ---- 1. 拉取 prebuilt 静态 proot (armv7a, 适配 Android 5.x 老内核) ----
      - name: Fetch prebuilt proot (armv7a-pre5)
        run: |
          mkdir -p app/src/main/assets
          curl -L -o /tmp/proot.tar.gz \
            "https://raw.githubusercontent.com/green-green-avk/build-proot-android/master/packages/proot-android-armv7a-pre5.tar.gz"
          tar -xzf /tmp/proot.tar.gz -C /tmp
          ls -la /tmp/root/bin/proot
          cp /tmp/root/bin/proot app/src/main/assets/proot

      # ---- 2. 拉取 Alpine armhf minirootfs 并打成未压缩 tar ----
      - name: Fetch Alpine rootfs and pack as tar
        run: |
          curl -L -o /tmp/rootfs.tar.gz \
            "https://mirrors.huaweicloud.com/alpine/v3.12/releases/armhf/alpine-minirootfs-3.12.10-armhf.tar.gz"
          mkdir -p /tmp/rootfs
          tar -xzf /tmp/rootfs.tar.gz -C /tmp/rootfs
          # 写死国内可切换镜像源
          printf '%s\n' \
            "https://mirrors.huaweicloud.com/alpine/v3.12/main" \
            "https://mirrors.huaweicloud.com/alpine/v3.12/community" > /tmp/rootfs/etc/apk/repositories
          tar -C /tmp/rootfs -cf app/src/main/assets/rootfs.tar .
          ls -la app/src/main/assets/rootfs.tar

      # ---- 3. 构建 APK ----
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: 34.0.0
          ndk-version: 25.1.8909393

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/25.1.8909393" >> local.properties
          cat local.properties

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload assets for debugging
        uses: actions/upload-artifact@v4
        with:
          name: container-assets
          path: |
            app/src/main/assets/proot
            app/src/main/assets/rootfs.tar
          retention-days: 7